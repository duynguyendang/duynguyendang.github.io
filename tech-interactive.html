*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{

html{scroll-behavior:smooth}

.bg-orbs .orb:nth-child(2){width:500px;height:500px;bottom:-10%;right:-5%;background:radial-gradient(circle,#00cec9,transparent);animation-delay:-10s}
.bg-orbs .orb:nth-child(3){width:400px;height:400px;top:40%;left:50%;background:radial-gradient(circle,#fd79a8,transparent);animation-delay:-20s}

@keyframes grainShift{0%{transform:translate(0,0)}25%{transform:translate(-2px,2px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}}
main{position:relative;z-index:2;flex:1;width:100%;max-width:1360px;margin:0 auto;padding:40px 24px 80px}
header{text-align:center;margin-bottom:48px;animation:fadeDown .8s ease-out both}

header .count{display:inline-block;padding:4px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:.85rem;color:var(--text-dim);font-family:var(--font-d)}
.bar{display:flex;flex-direction:column;gap:10px;max-width:900px;margin:0 auto 48px;animation:fadeDown .8s ease-out .1s both}
.search-wrap{flex:1;min-width:220px;position:relative;max-width:640px;margin:0 auto;width:100%}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-faint);pointer-events:none}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.95rem;font-family:inherit;outline:none;transition:all .25s}

.search-wrap input:focus{border-color:var(--accent1);background:rgba(108,92,231,.06);box-shadow:0 0 0 3px rgba(108,92,231,.12)}

.tag-cloud button{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:.75rem;cursor:pointer;transition:all .2s;font-family:inherit}
.tag-cloud button:hover{background:var(--surface-hover);color:var(--text)}
.tag-cloud button .n{opacity:.55;margin-left:4px;font-size:.7rem}
.tag-cloud button.active{background:rgba(108,92,231,.2);border-color:var(--accent1);color:var(--accent1)}
.tag-cloud button.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:48px;animation:fadeUp .8s ease-out .2s both}
.card{position:relative;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);padding:24px;display:block;text-align:left;font-family:inherit;color:inherit;cursor:pointer;transition:all .35s cubic-bezier(.22,1,.36,1);animation:cardIn .5s ease-out both;overflow:hidden;animation-delay:calc(var(--i)*12ms)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));opacity:0;transition:opacity .35s}

.card:hover{transform:translateY(-4px);border-color:var(--border-hover);background:var(--surface-hover);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.card:active{transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent1);outline-offset:2px}
.card .num{font-family:var(--font-d);font-size:.75rem;font-weight:600;color:var(--text-faint);margin-bottom:8px;letter-spacing:.05em}
.card h2{font-size:1.15rem;font-weight:600;margin-bottom:8px;line-height:1.3;letter-spacing:-.01em;padding-right:70px}

.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}

.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:20px;max-width:640px;width:100%;max-height:80vh;padding:36px;overflow-y:auto;position:relative;transform:scale(.95) translateY(20px);transition:transform .35s cubic-bezier(.22,1,.36,1)}

@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

</head>

(function(){
  const RING_ORDER=['adopt','trial','assess','hold','caution'];
  const RING_META={
    adopt:{label:'Adopt',  color:'#2dd4bf'},
    trial:{label:'Trial',  color:'#38bdf8'},
    assess:{label:'Assess',color:'#fbbf24'},
    hold:{label:'Hold',    color:'#fb923c'},
    caution:{label:'Caution',color:'#f87171'}
  };
  const QUADS=[
    {key:'languages & frameworks', label:'Languages & Frameworks'},
    {key:'tools', label:'Tools'},
    {key:'techniques', label:'Techniques'},
    {key:'platforms', label:'Platforms'}
  ];
  const ITEMS = RADAR_DATA.map(function(d,i){
    return {name:d.name, ring:d.ring, quad:d.quadrant, isNew:d.isNew, desc:d.description, tags:ITEM_TAGS[d.name]||[], n:i+1};
  });

  const grid=document.getElementById('grid'),
        emptyEl=document.getElementById('empty'),
        search=document.getElementById('search'),
        countEl=document.getElementById('countDisplay'),
        overlay=document.getElementById('modalOverlay'),
        modal=document.getElementById('modal'),
        modalBody=document.getElementById('modalBody'),
        tagCloud=document.getElementById('tagCloud');

  const state={tag:'',search:''};

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function trunc(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}
  function quadLabel(key){const q=QUADS.find(x=>x.key===key);return q?q.label:key;}
  function ringLabel(k){return RING_META[k].label;}

  function visible(item){
    if(state.tag && item.tags.indexOf(state.tag)===-1) return false;
    if(state.search){
      const q=state.search.toLowerCase();
      if((item.name+' '+item.desc+' '+item.tags.join(' ')).toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  }

  function cardHTML(item,i){
    const m=RING_META[item.ring];
    const tags=item.tags.map(function(t){
      return '<button class="tag-chip'+(state.tag===t?' active':'')+'" type="button" data-tag="'+esc(t)+'">'+esc(t)+'</button>';
    }).join('');
    return '<div class="card" role="button" tabindex="0" data-i="'+i+'" style="--i:'+(i%28)+'" aria-label="'+esc(item.name)+' · '+m.label+'">'+
      '<div class="num">#'+String(item.n).padStart(3,'0')+'</div>'+
      '<div class="ring-badge" style="color:'+m.color+';background:'+m.color+'1a;border:1px solid '+m.color+'44">'+m.label+'</div>'+
      '<h2>'+esc(item.name)+'</h2>'+
      '<div class="desc">'+esc(trunc(item.desc,170))+'</div>'+
      '<div class="tags">'+tags+(item.isNew==='TRUE'?'<button class="tag-chip t-new" type="button">New</button>':'')+'</div>'+
      '</div>';
  }

  function render(){
    let html='', shown=0;
    ITEMS.forEach(function(item,i){
      if(!visible(item)) return;
      shown++;
      html+=cardHTML(item,i);
    });
    grid.innerHTML=html;
    emptyEl.hidden=shown!==0;
    countEl.textContent=shown+' / '+ITEMS.length+' technologies';
    grid.querySelectorAll('.card').forEach(function(c){
      c.addEventListener('click',function(){openDetail(ITEMS[+c.dataset.i]);});
      c.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openDetail(ITEMS[+c.dataset.i]);}
      });
    });
    grid.querySelectorAll('.tag-chip').forEach(function(b){
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        setTag(b.dataset.tag==='New'?'':(b.dataset.tag||''));
      });
    });
    refreshTagCloud();
  }

  function openDetail(item){
    const m=RING_META[item.ring];
    const src=SOURCE_LINKS[item.name];
    const tags='<span style="color:'+m.color+';border-color:'+m.color+'44;background:'+m.color+'1a">'+m.label+'</span>'+
               '<span>'+quadLabel(item.quad)+'</span>'+
               (item.isNew==='TRUE'?'<span class="t-new">New</span>':'');
    const fileTags=item.tags.map(function(t){return '<span>'+esc(t)+'</span>';}).join('');
    let cta='';
    if(src) cta='<div class="section"><h3>Source</h3><a class="cta" href="'+esc(src)+'" target="_blank" rel="noopener">Open original source &rarr;</a></div>';
    modalBody.innerHTML=
      '<div class="num">#'+String(item.n).padStart(3,'0')+'</div>'+
      '<h2>'+esc(item.name)+'</h2>'+
      '<div class="section"><h3>Description</h3><p>'+esc(item.desc)+'</p></div>'+
      '<div class="section"><h3>Classification</h3><div class="tags">'+tags+'</div></div>'+
      (fileTags?'<div class="section"><h3>Tags</h3><div class="tags">'+fileTags+'</div></div>':'')+
      cta;
    overlay.classList.add('open');
    modal.scrollTop=0;
  }

  function closeModal(){
    overlay.classList.remove('open');
  }

  function setTag(t){
    state.tag=(t===state.tag?'':t);
    refreshTagCloud();
    render();
  }

  function refreshTagCloud(){
    const counts={};
    ITEMS.forEach(function(i){i.tags.forEach(function(t){counts[t]=(counts[t]||0)+1;});});
    const tags=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b);});
    tagCloud.innerHTML=tags.map(function(t){
      return '<button type="button" data-tag="'+esc(t)+'" class="'+(state.tag===t?'active':'')+'">'+esc(t)+'<span class="n">'+counts[t]+'</span></button>';
    }).join('');
    tagCloud.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){setTag(b.dataset.tag);});
    });
  }

  search.addEventListener('input',function(){state.search=search.value.trim();render();});

  document.getElementById('modalClose').onclick=closeModal;
  overlay.addEventListener('click',function(ev){if(ev.target===overlay)closeModal();});
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape')closeModal();
  });

  refreshTagCloud();
  render();

  const newCount=ITEMS.filter(function(i){return i.isNew==='TRUE';}).length;
  document.getElementById('foot-note').textContent='Generated '+new Date().toISOString().slice(0,10)+' · '+ITEMS.length+' technologies · '+newCount+' new · source: 05-technology-intelligence/radar/radar.json';
})();
